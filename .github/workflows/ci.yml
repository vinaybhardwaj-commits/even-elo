name: ci
# Typecheck + unit tests on every PR and push to main. Added by git-steward (14 Oct 2026).
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
